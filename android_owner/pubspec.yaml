name: android_owner
description: MyPet - Tierbesitzer Android App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.1
  http: ^1.2.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  mypet_shared:
    path: ../shared
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Erzeugt App-Icon (Android, adaptiv) aus derselben Bildquelle.
# Ausführen mit: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
