name: web_owner
description: MyPet - Tierbesitzer Web App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.1
  http: ^1.2.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  mypet_shared:
    path: ../shared
  flutter_secure_storage: ^9.0.0
  file_picker: ^8.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

# Erzeugt das Web-Favicon aus derselben Bildquelle wie das Android-Icon.
# Ausführen mit: dart run flutter_launcher_icons
flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/icon/favicon_source.png"
    background_color: "#4CAF50"
    theme_color: "#4CAF50"
